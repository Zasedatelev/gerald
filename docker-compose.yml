version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       quiz_tma
      POSTGRES_USER:     quiz
      POSTGRES_PASSWORD: quiz_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql   # авто-применяется при первом запуске
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz_tma"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Bot + API ───────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BOT_TOKEN:        ${BOT_TOKEN}
      DATABASE_URL:     postgresql://quiz:quiz_pass@db:5432/quiz_tma
      MINI_APP_URL:     ${MINI_APP_URL}
      JWT_SECRET:       ${JWT_SECRET}
      JWT_EXPIRES_HOURS: "24"
      API_HOST:         "0.0.0.0"
      API_PORT:         "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
